# .github/workflows/build.yml
name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-16

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 18
        run: sudo xcode-select -s /Applications/Xcode_18.0.app

      - name: Build Archive
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/3105.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA
        run: |
          APP="${{ github.workspace }}/build/3105.xcarchive/Products/Applications/3105.app"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r 3105.ipa Payload/
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: 3105.ipa
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 3105.ipa
