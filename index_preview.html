
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UI Preview</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#121212,#1f1230);padding:20px;color:white}
.card{background:#222;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 0 10px rgba(0,0,0,.3)}
.title{font-size:30px;color:#e040fb;font-weight:bold;text-align:center}
.sub{text-align:center;color:#b39ddb}
.btn{display:block;width:100%;padding:16px;margin:10px 0;border:none;border-radius:12px;background:#8e24aa;color:#fff;font-weight:bold}
.status{text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="title">FOX MOD</div>
<div class="sub">Engine Panel</div>
</div>

<div class="card status">
<h3>STATUS: OFF</h3>
<p>Standby</p>
<p>No app selected</p>
</div>

<div class="card">
<button class="btn">START FREE FIRE</button>
<button class="btn">SELECT GAME</button>
<button class="btn">PING ON</button>
<button class="btn">KHOA NUT NOI: TAT</button>
</div>

<div class="card">
<b>INSTRUCTIONS</b>
<p>Hướng dẫn sử dụng sẽ hiển thị ở đây.</p>
</div>
</body>
</html>
