  <title>🔥 Văn Bảo - Tổng điểm &amp; Markov</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .game-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      background: #0a0a1a;
    }

    #vt-tool {
      position: fixed;
      top: 80px;
      right: 20px;
      background: linear-gradient(145deg, rgba(0, 0, 0, 0.75), rgba(10, 20, 35, 0.85));
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 200, 80, 0.3), 0 0 16px rgba(255, 180, 0, 0.25);
      padding: 8px 12px;
      z-index: 999999;
      user-select: none;
      cursor: grab;
      touch-action: none;
      color: #f5e7c8;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      min-width: 210px;
      width: auto;
      transition: 0.2s ease;
      font-weight: 500;
      border-radius: 36px;
      border: 1px solid rgba(255, 200, 100, 0.4);
    }
    #vt-tool:active {
      cursor: grabbing;
    }
    #vt-tool.collapsed {
      padding: 4px 10px;
      border-radius: 32px;
      min-width: auto;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
    }
    .vt-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ffd966;
      text-shadow: 0 0 3px #ffaa33;
      letter-spacing: 0.5px;
    }
    
    .vt-session {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      color: #00ff66;
      font-family: monospace;
      border: 1px solid #00ff66;
      box-shadow: 0 0 5px #00ff66;
    }
    
    .vt-dice {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .vt-dice-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      line-height: 32px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      color: #ffcd7e;
      font-weight: bold;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 2px 5px rgba(0,0,0,0.2);
      font-family: monospace;
    }
    .vt-dice .tong-point {
      margin-left: 6px;
      background: rgba(0,0,0,0.5);
      padding: 2px 8px;
      border-radius: 30px;
      font-size: 13px;
    }
    .vt-result {
      font-size: 12px;
      margin-bottom: 6px;
      padding: 3px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      text-align: center;
    }
    .vt-tai {
      color: #ff5e7e;
      font-weight: bold;
      text-shadow: 0 0 3px #ff2a4a;
    }
    .vt-xiu {
      color: #6eff9e;
      font-weight: bold;
      text-shadow: 0 0 3px #28ff70;
    }
    .vt-prediction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 60px;
      padding: 4px 10px;
      margin: 6px 0 4px;
      gap: 6px;
    }
    .vt-pred-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      transition: 0.1s;
      box-shadow: 0 0 6px gold;
    }
    .vt-pred-dot.TAI {
      background: radial-gradient(70% 70%, #ff416c, #b0002a);
      animation: pulseRed 0.9s infinite alternate;
    }
    .vt-pred-dot.XIU {
      background: radial-gradient(70% 70%, #42e695, #0f9b4a);
      animation: pulseGreen 0.9s infinite alternate;
    }
    .vt-pred-dot.unknown {
      background: #6b6b6b;
      animation: none;
      box-shadow: none;
    }
    .vt-pred-label {
      font-size: 20px;
      font-weight: bold;
      margin: 0 2px;
      color: #ffdd99;
      text-shadow: 0 0 3px #ffaa33;
    }
    .vt-pred-conf {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 8px;
      border-radius: 30px;
      color: #ffd966;
      font-weight: bold;
    }
    .vt-reason {
      font-size: 9px;
      margin-top: 4px;
      opacity: 0.9;
      text-align: center;
      color: #eec77e;
      font-weight: 500;
    }
    .vt-type {
      font-size: 9px;
      margin-top: 2px;
      text-align: center;
      color: #ffbb55;
      font-weight: bold;
    }
    @keyframes pulseRed {
      0% { transform: scale(0.92); opacity: 0.85; box-shadow: 0 0 0 0 #ff4d6d; }
      100% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 6px rgba(255, 80, 100, 0); }
    }
    @keyframes pulseGreen {
      0% { transform: scale(0.92); opacity: 0.85; box-shadow: 0 0 0 0 #3eff7a; }
      100% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 6px rgba(70, 255, 100, 0); }
    }
    .collapsed .vt-dice,
    .collapsed .vt-result,
    .collapsed .vt-reason,
    .collapsed .vt-type {
      display: none;
    }
    .collapsed .vt-prediction {
      margin: 0;
      padding: 0;
      background: none;
      gap: 4px;
    }
    .collapsed .vt-pred-dot {
      width: 32px;
      height: 32px;
    }
    .collapsed .vt-pred-label {
      font-size: 16px;
    }
    .collapsed .vt-header {
      margin-bottom: 2px;
      font-size: 9px;
    }
    .collapsed .vt-session {
      margin-bottom: 3px;
      font-size: 8px;
      padding: 1px 5px;
    }
    body {
      background: #0a0f1a;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .mock-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, #10141f, #03060b);
      z-index: 0;
    }
  </style>
