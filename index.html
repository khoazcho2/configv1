<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Hồ Quốc - Tài Xỉu Analysis</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    height: -webkit-fill-available;
}
.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #00ff88, #ffd966, #00ff88);
    background-size: 200% auto;
    animation: flow 2s linear infinite;
    z-index: 9998;
}
@keyframes flow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
#robot {
    position: fixed;
    top: 50%; left: 10px;
    z-index: 9999;
    display: flex;
    align-items: center;
    cursor: grab;
    user-select: none;
}
#robot:active { cursor: grabbing; }
#robot img, .robot-emoji-fallback {
    width: 90px; height: 90px;
    pointer-events: none;
    filter: drop-shadow(0 0 15px #00ff88);
    animation: hoverRobot 3s ease-in-out infinite;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.robot-emoji-fallback {
    display: flex; align-items: center; justify-content: center; font-size: 60px;
}
@keyframes hoverRobot {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-20px) scale(1.1); }
}
#robot-info {
    background: rgba(0,20,40,0.9);
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 15px 20px;
    margin-left: 15px;
    min-width: 200px;
    max-width: calc(100vw - 120px);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,255,136,0.3);
    animation: boxPulse 2s ease-in-out infinite;
}
@keyframes boxPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0,255,136,0.2), inset 0 0 20px rgba(0,255,136,0.05); }
    50%       { box-shadow: 0 0 40px rgba(0,255,136,0.4), inset 0 0 20px rgba(0,255,136,0.1); }
}
#robot-info h3 { color: #00ff88; font-size: 16px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
#robot-info p  { color: #aaa; font-size: 12px; margin: 0; }
.status-indicator {
    display: inline-block; width: 8px; height: 8px;
    background: #00ff88; border-radius: 50%; animation: blink 1s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp   { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
.control-buttons { position: absolute; top: -45px; right: 0; display: flex; gap: 8px; }
.control-btn {
    background: #1a1a2e; border: 2px solid #ffd966;
    width: 35px; height: 35px; border-radius: 50%;
    cursor: pointer; color: #ffd966; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; font-weight: bold;
}
.control-btn:hover { background: #ffd966; color: #000; transform: scale(1.1); }
.control-btn.analysis-btn { border-color: #00ff88; color: #00ff88; }
.control-btn.analysis-btn:hover { background: #00ff88; color: #000; }
</style>
</head>
<body>

<div class="top-bar"></div>
<iframe src="https://lc79b.bet" id="gameFrame" style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;" allow="autoplay;fullscreen;payment;clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>

<div id="robot">
    <img src="https://i.postimg.cc/rwkZQhxp/Robot.gif" alt="Robot"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <span class="robot-emoji-fallback" style="display:none">🤖</span>
    <div id="robot-info" onclick="var o=document.getElementById('prediction-overlay');if(o)o.style.display='block';" style="cursor:pointer;" title="Bấm để hiện dự đoán">
        <h3><span class="status-indicator"></span> ROBOT HỒ QUỐC</h3>
        <p id="robot-status">Đang đồng bộ thuật toán đa tầng...</p>
        <p id="fetch-debug" style="font-size:10px;margin-top:4px;color:#ffd966;">⏳ Đang kết nối API...</p>
    </div>
    <div class="control-buttons">
        <button class="control-btn analysis-btn" id="analysisBtn" title="Analytics Dashboard">📊</button>
        <button class="control-btn" id="kellyBtn" title="Kelly Criterion">💰</button>
    </div>
</div>

<script>
'use strict';

window.addEventListener('error', (e) => { console.error('ERROR:', e.message, 'line', e.lineno); });
window.addEventListener('unhandledrejection', (e) => { console.error('REJECTION:', e.reason); });

// ============ GLOBALS ============
const DB_KEY          = 'taixiu_history';
const SESSION_LOG_KEY = 'taixiu_sessions_json';
const API_URL         = 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8';

let lastPhienId  = null;
let predictions  = [];
let historyGears = [];
let rawHistory   = [];

// ============ LOGGER ============
const logger = {
    data: [],
    init() {
        try { this.data = JSON.parse(localStorage.getItem(DB_KEY)) || []; }
        catch(e) { this.data = []; }
        console.log('Logger ready:', this.data.length, 'records');
    },
    log(id, d1, d2, d3, result) {
        try {
            const sum       = (parseInt(d1)||0) + (parseInt(d2)||0) + (parseInt(d3)||0);
            const resultStr = String(result||'').toUpperCase();
            const isTai     = sum > 10 || (sum === 0 && resultStr.includes('TÀI'));
            this.data.push({ id, timestamp: Date.now(),
                dice1: parseInt(d1)||0, dice2: parseInt(d2)||0, dice3: parseInt(d3)||0,
                sum, actual: isTai ? 'TAI' : 'XIU', raw: result });
            localStorage.setItem(DB_KEY, JSON.stringify(this.data));
        } catch(e) { console.error('Log error:', e); }
    },
    export() {
        let csv = 'id,timestamp,dice1,dice2,dice3,sum,actual,raw\n';
        this.data.forEach(r => {
            csv += `${r.id},${r.timestamp},${r.dice1},${r.dice2},${r.dice3},${r.sum},${r.actual},"${r.raw}"\n`;
        });
        return csv;
    },
    clear() { this.data = []; localStorage.removeItem(DB_KEY); }
};

// ============ STATS ============
function calculateStats() {
    const tai   = logger.data.filter(r => r.actual === 'TAI').length;
    const total = logger.data.length;
    if (total === 0) return { total:0, tai:0, xiu:0, tai_pct:0, xiu_pct:0 };
    return { total, tai, xiu: total-tai,
             tai_pct: (tai/total)*100, xiu_pct: ((total-tai)/total)*100 };
}

// ============ DRAG ============
function setupDrag() {
    const robot = document.getElementById('robot');
    if (!robot) return;
    let rDrag = false, rSX = 0, rSY = 0;
    setTimeout(() => { robot.style.top = (window.innerHeight/2 - robot.offsetHeight/2) + 'px'; }, 100);
    robot.addEventListener('mousedown', e => { rDrag=true; const r=robot.getBoundingClientRect(); rSX=e.clientX-r.left; rSY=e.clientY-r.top; e.preventDefault(); });
    robot.addEventListener('touchstart', e => { rDrag=true; const t=e.touches[0],r=robot.getBoundingClientRect(); rSX=t.clientX-r.left; rSY=t.clientY-r.top; }, {passive:true});
    document.addEventListener('mousemove', e => { if(!rDrag)return; robot.style.left=(e.clientX-rSX)+'px'; robot.style.top=(e.clientY-rSY)+'px'; });
    document.addEventListener('touchmove', e => { if(!rDrag)return; const t=e.touches[0]; robot.style.left=(t.clientX-rSX)+'px'; robot.style.top=(t.clientY-rSY)+'px'; }, {passive:false});
    document.addEventListener('mouseup',  () => { rDrag=false; });
    document.addEventListener('touchend', () => { rDrag=false; });
    console.log('Drag ready');
}

// ============ ANALYTICS ============
function setupAnalytics() {
    const btn = document.getElementById('analysisBtn');
    if (btn) btn.addEventListener('click', openDashboard);
}

function openDashboard() {
    if (logger.data.length === 0) { alert('No data yet.'); return; }
    const stats = calculateStats();
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.95);backdrop-filter:blur(5px);overflow-y:auto;padding:20px;color:#fff;font-family:monospace;';
    modal.innerHTML = `
        <div style="max-width:900px;margin:0 auto;">
            <div style="display:flex;justify-content:space-between;margin-bottom:20px;border-bottom:2px solid #00ff88;padding-bottom:10px;">
                <h2 style="color:#00ff88;margin:0;">🔬 ANALYSIS DASHBOARD</h2>
                <button onclick="this.closest('[style*=fixed]').remove()" style="background:#ff4466;border:none;padding:8px 16px;cursor:pointer;border-radius:4px;color:#fff;font-weight:bold;">CLOSE</button>
            </div>
            <div style="background:rgba(0,255,136,0.1);padding:15px;border-left:4px solid #00ff88;border-radius:4px;margin-bottom:20px;">
                <div style="font-size:12px;color:#aaa;">TOTAL ROUNDS</div>
                <div style="color:#00ff88;font-size:28px;font-weight:bold;">${stats.total}</div>
            </div>
            <div style="background:rgba(0,255,136,0.1);padding:15px;border-left:4px solid #00ff88;border-radius:4px;margin-bottom:20px;">
                <div style="font-size:12px;color:#aaa;">TAI vs XIU</div>
                <div style="color:#00ff88;font-size:18px;font-weight:bold;">
                    ${stats.tai} TAI (${stats.tai_pct.toFixed(2)}%) | ${stats.xiu} XIU (${stats.xiu_pct.toFixed(2)}%)
                </div>
            </div>
            <div style="background:#1a1a2e;padding:15px;border-radius:4px;margin-bottom:20px;">
                <h3 style="color:#00ff88;margin-top:0;">EXPORT DATA</h3>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button onclick="(function(){const csv=logger.export();const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='taixiu_'+Date.now()+'.csv';a.click();URL.revokeObjectURL(u);})()" style="background:#00ff88;border:none;padding:10px 20px;cursor:pointer;border-radius:4px;color:#000;font-weight:bold;">📥 EXPORT CSV</button>
                    <button onclick="exportSessionsJSON()" style="background:#ffd966;border:none;padding:10px 20px;cursor:pointer;border-radius:4px;color:#000;font-weight:bold;">📥 EXPORT JSON</button>
                    <button onclick="(function(){const s=getSessions();console.log(s);alert('Sessions in console: '+s.length);})()" style="background:#0088ff;border:none;padding:10px 20px;cursor:pointer;border-radius:4px;color:#fff;font-weight:bold;">🖥️ VIEW JSON</button>
                </div>
            </div>
        </div>`;
    document.body.appendChild(modal);
}

// ============ SESSION JSON ============
function saveSessionJSON(data) {
    try {
        const stored   = localStorage.getItem(SESSION_LOG_KEY);
        const sessions = stored ? JSON.parse(stored) : [];
        sessions.push(data);
        localStorage.setItem(SESSION_LOG_KEY, JSON.stringify(sessions));
    } catch(e) { console.error('JSON save error:', e); }
}

function exportSessionsJSON() {
    try {
        const stored = localStorage.getItem(SESSION_LOG_KEY);
        if (!stored) { alert('No session data yet'); return; }
        const sessions = JSON.parse(stored);
        const blob = new Blob([JSON.stringify(sessions, null, 2)], {type:'application/json'});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'taixiu_sessions_' + Date.now() + '.json'; a.click();
        URL.revokeObjectURL(url);
    } catch(e) { console.error('Export error:', e); }
}

function getSessions() {
    try { const s = localStorage.getItem(SESSION_LOG_KEY); return s ? JSON.parse(s) : []; }
    catch(e) { return []; }
}

// ============ KELLY ============
function setupKellyBtn() {
    const btn = document.getElementById('kellyBtn');
    if (!btn) return;
    btn.addEventListener('click', () => {
        if (logger.data.length < 30) { alert('Need at least 30 rounds'); return; }
        const stats   = calculateStats();
        const winRate = stats.total > 0 ? stats.tai / stats.total : 0.5;
        const kelly   = Math.max(winRate - (1 - winRate), 0);
        alert('Kelly Criterion (TAI bet):\n\n' +
              'Win Rate: ' + (winRate*100).toFixed(2) + '%\n' +
              'Kelly f*: ' + kelly.toFixed(4) + '\n\n' +
              '¼ Kelly: '  + (kelly*0.25*100).toFixed(2) + '%\n' +
              '½ Kelly: '  + (kelly*0.5*100).toFixed(2)  + '%');
    });
}

/* ================= THUẬT TOÁN SUPER AI VI LONG (15 TẦNG) ================= */
function superViLongAlgorithm() {
    if (historyGears.length < 20) return { pred: -1, rate: 0, trend: "LỊCH SỬ < 20" };

    const h = historyGears;
    let finalPred = -1, confBase = 0, logicMsg = "CHƯA TRIGGER";

    // ========== LAYER 1: MARKOV CHAIN (State transition probability) ==========
    let markovPred = -1;
    if (h.length >= 20) {
        // Build 2-state Markov matrix from history
        const trans = { '0to0': 0, '0to1': 0, '1to0': 0, '1to1': 0 };
        for (let i = 0; i < h.length - 1; i++) {
            const key = h[i] + 'to' + h[i+1];
            trans[key]++;
        }
        // Probability of next state given current state
        const p0to1 = trans['0to1'] / (trans['0to0'] + trans['0to1'] || 1);
        const p1to0 = trans['1to0'] / (trans['1to1'] + trans['1to0'] || 1);
        // If current is 0, predict based on p0to1
        // If current is 1, predict based on p1to0
        if (h[0] === 0 && p0to1 > 0.6) markovPred = 1;
        else if (h[0] === 1 && p1to0 > 0.6) markovPred = 0;
        else if (h[0] === 0 && p0to1 < 0.4) markovPred = 0;
        else if (h[0] === 1 && p1to0 < 0.4) markovPred = 1;
    }

    // ========== LAYER 2: STREAK (Consecutive same values) ==========
    let streakPred = -1;
    if (h.length >= 10) {
        let streak = 1;
        for (let i = 0; i < h.length - 1; i++) {
            if (h[i] === h[i+1]) streak++;
            else break;
        }
        // Long streak = trend continues
        if (streak >= 4) {
            streakPred = h[0];
        } else if (streak === 1) {
            // Single value = likely to alternate
            streakPred = h[0] === 1 ? 0 : 1;
        }
    }

    // ========== LAYER 3: PATTERN REPETITION (Does pattern repeat?) ==========
    let patternPred = -1;
    if (h.length >= 16) {
        const pattern = h.slice(0, 4); // First 4 values as pattern
        let matches = 0;
        for (let i = 4; i < h.length - 3; i += 4) {
            const seg = h.slice(i, i+4);
            if (seg[0] === pattern[0] && seg[1] === pattern[1] && 
                seg[2] === pattern[2] && seg[3] === pattern[3]) {
                matches++;
            }
        }
        if (matches >= 2) {
            // Pattern repeats = continue pattern
            patternPred = pattern[0];
        }
    }

    // ========== LAYER 4: FREQUENCY ANALYSIS (TAI vs XIU ratio) ==========
    let frequencyPred = -1;
    if (h.length >= 25) {
        const segment = h.slice(0, 25);
        const taiCount = segment.filter(x => x === 1).length;
        const xiuCount = 25 - taiCount;
        // If heavily biased to TAI, predict XIU (reversal)
        // If heavily biased to XIU, predict TAI (reversal)
        if (taiCount >= 18) frequencyPred = 0;
        else if (xiuCount >= 18) frequencyPred = 1;
        else if (taiCount >= 15) frequencyPred = 0; // Slight bias = reversal
        else if (xiuCount >= 15) frequencyPred = 1;
    }

    // ========== LAYER 5: ENTROPY (Disorder measure) ==========
    let entropyScore = 0;
    for (let i = 0; i < h.length - 1; i++) {
        if (h[i] !== h[i+1]) entropyScore++;
    }
    const entropyRatio = entropyScore / (h.length - 1);
    const entropyPred = entropyRatio < 0.4 ? h[0] : (entropyRatio > 0.6 ? (h[0]===1?0:1) : -1);

    // ========== LAYER 6: AUTOCORRELATION LAG-3 ==========
    let autoCorr = -1;
    if (h.length >= 10) {
        let corr = 0;
        const mean = h.slice(0,10).reduce((a,b)=>a+b)/10;
        for (let i = 0; i < 7; i++) {
            corr += (h[i] - mean) * (h[i+3] - mean);
        }
        if (Math.abs(corr) > 1.5) {
            autoCorr = corr > 0 ? h[0] : (h[0]===1?0:1);
        }
    }

    // ========== LAYER 7: VOLATILITY BANDS ==========
    let volPred = -1;
    if (h.length >= 20) {
        const prices = h.slice(0,20);
        const mean = prices.reduce((a,b)=>a+b)/20;
        const variance = prices.reduce((a,b)=>a + (b-mean)*(b-mean), 0)/20;
        const stddev = Math.sqrt(variance);
        if (prices[0] > mean + stddev) volPred = 0;
        else if (prices[0] < mean - stddev) volPred = 1;
    }

    // ========== LAYER 8: MOVING AVERAGE CROSSOVER ==========
    let maPred = -1;
    if (h.length >= 15) {
        const ma5 = h.slice(0,5).reduce((a,b)=>a+b)/5;
        const ma10 = h.slice(0,10).reduce((a,b)=>a+b)/10;
        if (ma5 > ma10 + 0.15) maPred = 1;
        else if (ma5 < ma10 - 0.15) maPred = 0;
    }

    // ========== LAYER 9: RUNS TEST ==========
    let runsPred = -1;
    if (h.length >= 15) {
        let runs = 1;
        for (let i = 0; i < h.length - 1; i++) {
            if (h[i] !== h[i+1]) runs++;
        }
        const expectedRuns = 2 * h.length * 0.5 * 0.5 / (h.length - 1);
        if (runs < expectedRuns * 0.6) runsPred = h[0];
        else if (runs > expectedRuns * 1.4) runsPred = h[0]===1?0:1;
    }

    // ========== LAYER 10: KELLY CRITERION ==========
    let kellyPred = -1;
    if (h.length >= 40) {
        const wins = h.slice(0,40).filter(x=>x===1).length;
        const p = wins / 40;
        const kelly = 2*p - 1;
        if (Math.abs(kelly) > 0.15) {
            kellyPred = kelly > 0 ? 1 : 0;
        }
    }

    // ========== LAYER 11: CHI-SQUARE GOODNESS OF FIT ==========
    let chiPred = -1;
    if (h.length >= 30) {
        const observed = [h.slice(0,30).filter(x=>x===0).length, h.slice(0,30).filter(x=>x===1).length];
        let chi2 = 0;
        for (let i = 0; i < 2; i++) {
            chi2 += Math.pow(observed[i] - 15, 2) / 15;
        }
        if (chi2 > 5.0) chiPred = observed[1] > 15 ? 1 : 0;
    }

    // ========== LAYER 12: HURST EXPONENT (Trend strength) ==========
    let hurstPred = -1;
    if (h.length >= 25) {
        const h1 = h.slice(0, Math.floor(h.length/2));
        const h2 = h.slice(Math.floor(h.length/2));
        const mean1 = h1.reduce((a,b)=>a+b)/h1.length;
        const mean2 = h2.reduce((a,b)=>a+b)/h2.length;
        if (Math.abs(mean2 - mean1) > 0.2) {
            hurstPred = mean2 > mean1 ? 1 : 0;
        }
    }

    // ========== LAYER 13: GARCH VOLATILITY CLUSTERING ==========
    let garchPred = -1;
    if (h.length >= 20) {
        const returns = [];
        for (let i = 1; i < Math.min(20, h.length); i++) {
            returns.push(h[i] - h[i-1]);
        }
        const variance = returns.reduce((a,b)=>a+b*b, 0) / returns.length;
        const lastVol = Math.abs(returns[returns.length-1]);
        if (lastVol > Math.sqrt(variance) * 1.8) {
            garchPred = h[0]===1?0:1;
        }
    }

    // ========== LAYER 14: RECURRENCE PLOT ==========
    let recurPred = -1;
    if (h.length >= 10) {
        let recurrence = 0;
        for (let i = 0; i < 7; i++) {
            if (h[i] === h[i+3]) recurrence++;
        }
        if (recurrence >= 5) recurPred = h[0];
    }

    // ========== LAYER 15: COPULA DEPENDENCE ==========
    let copulaPred = -1;
    if (h.length >= 15) {
        let concordant = 0, discordant = 0;
        for (let i = 0; i < 10; i++) {
            for (let j = i+1; j < 10; j++) {
                if ((h[i]===1 && h[j]===1) || (h[i]===0 && h[j]===0)) concordant++;
                else discordant++;
            }
        }
        const tau = (concordant - discordant) / (concordant + discordant || 1);
        if (Math.abs(tau) > 0.35) copulaPred = tau > 0 ? h[0] : (h[0]===1?0:1);
    }

    // ========== DECISION ENGINE: Weighted Voting ==========
    const votes = [
        {pred: markovPred,    weight: 1.8, name: "MARKOV"},
        {pred: streakPred,    weight: 1.7, name: "STREAK"},
        {pred: patternPred,   weight: 1.6, name: "PATTERN"},
        {pred: frequencyPred, weight: 1.7, name: "FREQUENCY"},
        {pred: entropyPred,   weight: 1.2, name: "ENTROPY"},
        {pred: autoCorr,      weight: 1.3, name: "AUTOCORR"},
        {pred: volPred,       weight: 1.2, name: "VOLATILITY"},
        {pred: maPred,        weight: 1.0, name: "MA_CROSS"},
        {pred: runsPred,      weight: 1.1, name: "RUNS"},
        {pred: kellyPred,     weight: 1.4, name: "KELLY"},
        {pred: chiPred,       weight: 1.3, name: "CHI2"},
        {pred: hurstPred,     weight: 1.2, name: "HURST"},
        {pred: garchPred,     weight: 1.1, name: "GARCH"},
        {pred: recurPred,     weight: 1.0, name: "RECUR"},
        {pred: copulaPred,    weight: 1.2, name: "COPULA"}
    ];

    let taiScore = 0, xiuScore = 0;
    let firedLayers = [];
    for (const v of votes) {
        if (v.pred === -1) continue;
        firedLayers.push(v.name);
        if (v.pred === 1) taiScore += v.weight;
        else xiuScore += v.weight;
    }

    if (firedLayers.length < 2) return { pred: -1, rate: 0, trend: "LAYERS < 2" };

    const totalScore = taiScore + xiuScore;
    finalPred = taiScore > xiuScore ? 1 : 0;
    const confidence = Math.round((Math.max(taiScore, xiuScore) / totalScore) * 100);
    const topFired = firedLayers.slice(0, 4).join(" + ");

    return {
        pred: finalPred,
        rate: Math.min(Math.max(confidence, 51), 99),
        trend: topFired.substring(0, 40)
    };
}

// ============ FETCH LOOP ============
function setupFetchLoop() {
    setInterval(fetchAndLog, 2000);
    console.log('Fetch loop started');
}

async function fetchAndLog() {
    const dbg = document.getElementById('fetch-debug');
    try {
        const response = await Promise.race([
            fetch(API_URL, { cache: 'no-store', method: 'GET' }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 5000))
        ]);
        if (dbg) dbg.textContent = '⚠️ HTTP ' + response.status;
        if (!response.ok) return;
        const data = await response.json();
        if (dbg) dbg.textContent = '✅ API OK — phiên: ' + (data.list&&data.list[0]?data.list[0].id:'?');
        if (!data || !data.list || data.list.length === 0) return;

        const latest = data.list[0];
        if (!latest || !latest.id) return;

        // Rebuild full history for algo on every poll
        historyGears = data.list.slice(0, 40).map(x => {
            const sum = (x.dice1||0) + (x.dice2||0) + (x.dice3||0);
            if (sum === 0 && x.resultTruyenThong) return x.resultTruyenThong === 'TAI' ? 1 : 0;
            return sum > 10 ? 1 : 0;
        });
        rawHistory = data.list.slice(0, 40);

        if (latest.id !== lastPhienId) {
            lastPhienId = latest.id;
            if (latest.dice1 && latest.dice2 && latest.dice3) {
                logger.log(latest.id, latest.dice1, latest.dice2, latest.dice3, latest.result || '');
            }
            displayPrediction(latest);
        }
    } catch(e) {
        if (dbg) dbg.textContent = '❌ ' + (e.message||'fetch blocked');
        console.error('Fetch error:', e);
    }
}

// ============ DISPLAY PREDICTION ============
function displayPrediction(data) {
    try {
        const phienId     = data.id || ('#' + Math.floor(Math.random() * 10000000));
        const d1          = parseInt(data.dice1) || 0;
        const d2          = parseInt(data.dice2) || 0;
        const d3          = parseInt(data.dice3) || 0;
        const sum         = d1 + d2 + d3;
        const result      = String(data.result || '').toUpperCase();
        const isTai       = sum > 10 || (sum === 0 && (result.includes('TÀI') || result.includes('TAI')));
        const actualResult = isTai ? 'TÀI' : 'XIU';

        // SuperViLong 15-layer prediction
        const analysis = superViLongAlgorithm();
        let prediction, confidence, trendLabel;

        // Real TAI/XIU % from last 30 rounds of actual history
        const h30    = historyGears.slice(0, 30);
        const taiCnt = h30.filter(x => x === 1).length;
        const xiuCnt = h30.length - taiCnt;
        const taiPct = h30.length > 0 ? Math.round(taiCnt / h30.length * 100) : 50;
        const xiuPct = 100 - taiPct;

        if (analysis.pred === -1) {
            prediction = taiPct >= 50 ? 'TÀI' : 'XIU';
            confidence = Math.max(taiPct, xiuPct);
            trendLabel = 'ĐANG LẤY DỮ LIỆU...';
        } else {
            prediction = analysis.pred === 1 ? 'TÀI' : 'XIU';
            // Real confidence = algo agreement weighted with actual history %
            const histBias = prediction === 'TÀI' ? taiPct : xiuPct;
            confidence = Math.round((analysis.rate * 0.6) + (histBias * 0.4));
            confidence = Math.min(Math.max(confidence, 51), 97);
            trendLabel = analysis.trend;
        }

        const isCorrect = prediction === actualResult;
        predictions.push({ phienId, predicted: prediction, actual: actualResult,
                           correct: isCorrect, confidence, dices:[d1,d2,d3], sum, timestamp: Date.now() });

        const recent         = predictions.slice(-20);
        const recentAccuracy = recent.length > 0 ? (recent.filter(p => p.correct).length / recent.length) * 100 : 0;

        saveSessionJSON({ phienId, timestamp: new Date().toISOString(),
            prediction, actual: actualResult, correct: isCorrect, confidence,
            dices:[d1,d2,d3], sum, accuracy_20_recent: recentAccuracy,
            total_predictions: predictions.length, trend: trendLabel });

        const pColor = prediction === 'TÀI' ? '#00ff88' : '#ff6666';
        const pBg    = prediction === 'TÀI' ? 'rgba(0,255,136,0.2)' : 'rgba(255,100,100,0.2)';

        // Guard: skip low confidence rounds before doing any DOM work
        if (confidence < 70) return;

        // Remove any existing overlay cleanly
        const old = document.getElementById('prediction-overlay');
        if (old) {
            old._onOMove && document.removeEventListener('mousemove', old._onOMove);
            old._onOMove && document.removeEventListener('touchmove', old._onOMove);
            old._onOUp   && document.removeEventListener('mouseup',   old._onOUp);
            old._onOUp   && document.removeEventListener('touchend',  old._onOUp);
            old.remove();
        }

        const overlay = document.createElement('div');
        overlay.id = 'prediction-overlay';
        overlay.style.cssText = `position:fixed;top:10px;right:10px;width:220px;
            background:linear-gradient(135deg,rgba(0,0,0,0.97),rgba(0,20,40,0.97));
            border:2px solid #00ff88;border-radius:12px;padding:12px 14px;z-index:99999;
            backdrop-filter:blur(15px);box-shadow:0 0 30px rgba(0,255,136,0.4);
            animation:slideDown 0.4s ease-out;font-family:monospace;color:#fff;
            cursor:grab;user-select:none;max-height:90vh;overflow-y:auto;`;

        // Set innerHTML BEFORE attaching drag listeners
        overlay.innerHTML = `
            <div style="text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #00ff88;position:relative;">
                <button onclick="document.getElementById('prediction-overlay').style.display='none'" style="position:absolute;right:0;top:0;background:rgba(255,50,50,0.9);border:none;color:#fff;border-radius:50%;width:32px;height:32px;font-size:22px;font-weight:bold;cursor:pointer;line-height:32px;padding:0;box-shadow:0 0 10px rgba(255,50,50,0.6);">−</button>
                <h3 style="margin:0;color:#00ff88;font-size:13px;">ROBOT HỒ QUỐC</h3>
                <div style="color:#ffd966;font-size:12px;margin-top:3px;font-weight:bold;">Phiên: ${phienId}</div>
                <div style="color:#00ffff;font-size:10px;margin-top:3px;">${trendLabel}</div>
                <div style="display:flex;justify-content:center;gap:12px;margin-top:6px;">
                    <div style="background:rgba(0,255,136,0.15);padding:3px 10px;border-radius:6px;border:1px solid #00ff88;">
                        <span style="color:#00ff88;font-weight:bold;font-size:13px;">TÀI ${taiPct}%</span>
                    </div>
                    <div style="background:rgba(255,100,100,0.15);padding:3px 10px;border-radius:6px;border:1px solid #ff6666;">
                        <span style="color:#ff6666;font-weight:bold;font-size:13px;">XIU ${xiuPct}%</span>
                    </div>
                </div>
            </div>
            <div style="background:${pBg};padding:12px;border-radius:8px;border:3px solid ${pColor};margin-bottom:12px;text-align:center;">
                <div style="color:#aaa;font-size:9px;margin-bottom:8px;">📊 DỰ ĐOÁN:</div>
                <div style="display:flex;justify-content:space-around;align-items:center;">
                    <div>
                        <div style="font-size:28px;font-weight:bold;color:${pColor};letter-spacing:1px;">${prediction}</div>
                        <div style="font-size:8px;color:#aaa;margin-top:2px;">Dự đoán</div>
                    </div>
                    <div style="font-size:24px;">${isCorrect ? '✅' : '❌'}</div>
                    <div>
                        <div style="font-size:28px;font-weight:bold;color:${actualResult==='TÀI'?'#00ff88':'#ff6666'};letter-spacing:1px;">${actualResult}</div>
                        <div style="font-size:8px;color:#aaa;margin-top:2px;">Thực tế</div>
                    </div>
                </div>
            </div>
            <div style="background:rgba(0,255,136,0.1);padding:10px;border-radius:6px;margin-bottom:10px;">
                <div style="color:#aaa;font-size:8px;margin-bottom:6px;">CONFIDENCE:</div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <div style="flex:1;height:12px;background:rgba(0,255,136,0.2);border-radius:6px;">
                        <div style="width:${confidence}%;height:100%;background:linear-gradient(90deg,#00ff88,#00ddff);border-radius:6px;"></div>
                    </div>
                    <div style="color:#00ff88;font-weight:bold;font-size:12px;min-width:35px;">${confidence.toFixed(0)}%</div>
                </div>
                ${confidence >= 90
                    ? '<div style="margin-top:6px;padding:6px;background:rgba(255,215,0,0.3);border:1px solid #ffd966;border-radius:4px;"><div style="color:#ffd966;font-weight:bold;font-size:11px;text-align:center;">🎯 CẶP CƯỢC ' + prediction + '</div></div>'
                    : '<div style="margin-top:6px;padding:6px;background:rgba(200,100,100,0.2);border:1px solid #ff6666;border-radius:4px;"><div style="color:#ff6666;font-weight:bold;font-size:10px;text-align:center;">⏸️ SKIP (&lt; 90%)</div></div>'}
            </div>
            <div style="background:rgba(255,215,0,0.1);padding:8px;border-radius:6px;margin-bottom:8px;text-align:center;">
                <div style="color:#aaa;font-size:8px;margin-bottom:3px;">ACCURACY (20 phiên):</div>
                <div style="font-size:13px;font-weight:bold;color:#ffd966;">${recentAccuracy.toFixed(1)}%</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;color:#aaa;text-align:center;padding-top:10px;border-top:1px solid rgba(0,255,136,0.2);">
                <div><div style="color:#fff;font-weight:bold;font-size:14px;">${d1}</div><div style="font-size:9px;">Xúc 1</div></div>
                <div><div style="color:#fff;font-weight:bold;font-size:14px;">${d2}</div><div style="font-size:9px;">Xúc 2</div></div>
                <div><div style="color:#fff;font-weight:bold;font-size:14px;">${d3}</div><div style="font-size:9px;">Sum:${sum}</div></div>
            </div>`;

        // Overlay drag - attach AFTER innerHTML so listeners aren't wiped
        let oDrag=false, oSX=0, oSY=0;
        function onOMove(e) {
            if(!oDrag) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            overlay.style.left = (cx - oSX) + 'px';
            overlay.style.top  = (cy - oSY) + 'px';
            overlay.style.right = 'auto';
            overlay.style.transform = 'none';
        }
        function onOUp() { oDrag = false; }
        // Store refs for cleanup on next render cycle
        overlay._onOMove = onOMove;
        overlay._onOUp   = onOUp;
        overlay.addEventListener('mousedown', e => {
            oDrag=true;
            const r=overlay.getBoundingClientRect();
            oSX=e.clientX-r.left; oSY=e.clientY-r.top;
            e.stopPropagation();
        });
        overlay.addEventListener('touchstart', e => {
            oDrag=true;
            const t=e.touches[0], r=overlay.getBoundingClientRect();
            oSX=t.clientX-r.left; oSY=t.clientY-r.top;
            e.stopPropagation();
        }, {passive:true});
        document.addEventListener('mousemove', onOMove);
        document.addEventListener('touchmove', onOMove, {passive:false});
        document.addEventListener('mouseup',   onOUp);
        document.addEventListener('touchend',  onOUp);

        document.body.appendChild(overlay);

    } catch(e) { console.error('displayPrediction error:', e.message); }
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
    try {
        setupDrag();
        logger.init();
        setupAnalytics();
        setupKellyBtn();
        setupFetchLoop();
        console.log('App initialized');
    } catch(e) { console.error('Init error:', e.message); }
});
</script>
