<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - tool247</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', 'Plus Jakarta Sans', -apple-system, sans-serif;
        }
        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        /* Background với ảnh GIF */
        .login-bg {
            background-image: url('https://i.pinimg.com/originals/5c/3e/39/5c3e39b6d872f973a5a3aaa1179dce5d.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }
        
        /* Lớp phủ tối để chữ nổi bật */
        .login-bg::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        
        .login-card {
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.92);
            border-radius: 2rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            padding: 2rem 2rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Logo style */
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }
        .logo-img:hover {
            transform: scale(1.05);
        }
        
        /* Input focus */
        .input-field {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(203, 213, 225, 0.5);
        }
        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: rgba(255, 255, 255, 0.9);
        }
        
        /* Responsive cho mobile */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem 1.25rem 2rem;
                border-radius: 1.5rem;
                margin: 0.5rem;
            }
            .logo-img {
                width: 64px;
                height: 64px;
            }
            .login-bg {
                padding: 0.5rem;
                background-attachment: scroll;
            }
            .login-bg::before {
                background: rgba(0, 0, 0, 0.5);
            }
        }
        
        /* Responsive cho tablet */
        @media (min-width: 481px) and (max-width: 768px) {
            .login-card {
                padding: 2rem 1.75rem 2.5rem;
                max-width: 400px;
            }
            .logo-img {
                width: 72px;
                height: 72px;
            }
        }
        
        /* Responsive cho desktop lớn */
        @media (min-width: 1200px) {
            .login-card {
                max-width: 480px;
                padding: 2.5rem 2.5rem 3rem;
            }
            .logo-img {
                width: 96px;
                height: 96px;
            }
        }
        
        /* Fix background cho mobile */
        @supports (-webkit-touch-callout: none) {
            .login-bg {
                background-attachment: scroll;
            }
        }
    </style>
</head>
<body>
    <div class="login-bg">
        <div class="login-card">
            <!-- Logo -->
            <div class="text-center mb-6 md:mb-8">
                <div class="flex justify-center mb-4">
                    <img src="logo.png" 
                         alt="tool247 Logo" 
                         class="logo-img"
                         loading="lazy">
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold font-display text-gray-800">
                    ĐĂNG NHẬP
                </h2>
                <p class="text-gray-500 text-sm mt-1">Chào mừng bạn trở lại!</p>
            </div>
            
            
            
            <form method="POST" class="space-y-5" onsubmit="return validateForm()">
                <div class="space-y-1">
                    <label class="block text-sm font-semibold text-gray-700">Tên đăng nhập</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400 text-sm"></i>
                        </div>
                        <input type="text" name="username" id="username" required 
                               class="input-field w-full pl-10 pr-4 py-3 rounded-xl focus:outline-none text-gray-800 placeholder-gray-400"
                               placeholder="Nhập tên đăng nhập">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-semibold text-gray-700">Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400 text-sm"></i>
                        </div>
                        <input type="password" name="password" id="password" required 
                               class="input-field w-full pl-10 pr-4 py-3 rounded-xl focus:outline-none text-gray-800 placeholder-gray-400"
                               placeholder="Nhập mật khẩu">
                    </div>
                </div>
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 text-base md:text-lg font-display">
                    <i class="fas fa-sign-in-alt mr-2"></i> Đăng Nhập
                </button>
            </form>
            <p class="text-center text-gray-600 mt-6 text-sm md:text-base">
                Chưa có tài khoản? 
                <a href="register.php" class="text-blue-500 hover:text-blue-700 font-semibold hover:underline transition-all">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script>
        function validateForm() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            
            if (username === '' || password === '') {
                Swal.fire({
                    icon: 'warning',
                    title: 'Thiếu thông tin',
                    text: 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu',
                    confirmButtonColor: '#F59E0B',
                    confirmButtonText: 'OK',
                    customClass: {
                        popup: 'font-inter',
                        confirmButton: 'font-semibold'
                    }
                });
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
