<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Hồ Quốc - Tài Xỉu Analysis</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #000; 
    color: #fff; 
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
}

.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #00ff88, #ffd966, #00ff88);
    background-size: 200% auto;
    animation: flow 2s linear infinite;
    z-index: 9998;
}

@keyframes flow { 
    0% { background-position: 0% 50%; } 
    100% { background-position: 200% 50%; } 
}

#robot {
    position: fixed;
    top: 50%; left: 10px;
    z-index: 9999;
    display: flex;
    align-items: center;
    cursor: grab;
    user-select: none;
}

#robot:active { cursor: grabbing; }

#robot img, .robot-emoji-fallback {
    width: 90px;
    height: 90px;
    pointer-events: none;
    filter: drop-shadow(0 0 15px #00ff88);
    animation: hoverRobot 3s ease-in-out infinite;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.robot-emoji-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}

@keyframes hoverRobot {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.1); }
}

#robot-info {
    background: rgba(0, 20, 40, 0.9);
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 15px 20px;
    margin-left: 15px;
    min-width: 200px;
    max-width: calc(100vw - 120px);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    animation: boxPulse 2s ease-in-out infinite;
}

@keyframes boxPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.05); }
    50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.4), inset 0 0 20px rgba(0, 255, 136, 0.1); }
}

#robot-info h3 {
    color: #00ff88;
    font-size: 16px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
}

#robot-info p {
    color: #aaa;
    font-size: 12px;
    margin: 0;
}

.status-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

@keyframes slideUp {
    from {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
    to {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
    }
}

.control-buttons {
    position: absolute;
    top: -45px;
    right: 0;
    display: flex;
    gap: 8px;
}

.control-btn {
    background: #1a1a2e;
    border: 2px solid #ffd966;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    color: #ffd966;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-weight: bold;
}

.control-btn:hover {
    background: #ffd966;
    color: #000;
    transform: scale(1.1);
}

.control-btn.analysis-btn { border-color: #00ff88; color: #00ff88; }
.control-btn.analysis-btn:hover { background: #00ff88; color: #000; }
</style>
</head>
<body>

<div class="top-bar"></div>

<iframe src="https://lc79b.bet" style="position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1;"></iframe>

<div id="robot">
    <img src="https://i.postimg.cc/rwkZQhxp/Robot.gif" alt="Robot" 
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    <span class="robot-emoji-fallback" style="display:none">🤖</span>
    
    <div id="robot-info">
        <h3><span class="status-indicator"></span> ROBOT HỒ QUỐC</h3>
        <p>Đang đồng bộ thuật toán da tằng...</p>
    </div>
    
    <div class="control-buttons">
        <button class="control-btn analysis-btn" id="analysisBtn" title="Analytics Dashboard">📊</button>
        <button class="control-btn" id="kellyBtn" title="Kelly Criterion">💰</button>
    </div>
</div>

<script>
'use strict';

// Global error handler
window.addEventListener('error', (e) => {
    console.error('UNCAUGHT ERROR:', e.message, 'at line', e.lineno);
});

window.addEventListener('unhandledrejection', (e) => {
    console.error('UNHANDLED REJECTION:', e.reason);
});

// Wait for DOM ready
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM Ready - initializing...');
    initializeApp();
});

function initializeApp() {
    try {
        setupDrag();
        setupDataLogger();
        setupAnalytics();
setupFetchLoop();
        console.log('✓ App initialized');
    } catch (e) {
        console.error('Init error:', e.message);
    }
}

// ============ DRAG FUNCTIONALITY ============
function setupDrag() {
    const robot = document.getElementById('robot');
    if (!robot) {
        console.error('Robot element not found');
        return;
    }

    let drag = false, sx = 0, sy = 0;

    // Center robot initially
    setTimeout(() => {
        try {
            const h = robot.offsetHeight;
            robot.style.top = (window.innerHeight / 2 - h / 2) + 'px';
        } catch (e) {
            console.error('Positioning error:', e);
        }
    }, 100);

    robot.addEventListener('mousedown', (e) => {
        drag = true;
        const r = robot.getBoundingClientRect();
        sx = e.clientX - r.left;
        sy = e.clientY - r.top;
        e.preventDefault();
    });

    robot.addEventListener('touchstart', (e) => {
        drag = true;
        const t = e.touches[0];
        const r = robot.getBoundingClientRect();
        sx = t.clientX - r.left;
        sy = t.clientY - r.top;
    }, { passive: true });

    document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        robot.style.left = (e.clientX - sx) + 'px';
        robot.style.top = (e.clientY - sy) + 'px';
    });

    document.addEventListener('touchmove', (e) => {
        if (!drag) return;
        const t = e.touches[0];
        robot.style.left = (t.clientX - sx) + 'px';
        robot.style.top = (t.clientY - sy) + 'px';
    }, { passive: false });

    document.addEventListener('mouseup', () => { drag = false; });
    document.addEventListener('touchend', () => { drag = false; });
    
    console.log('✓ Drag setup complete');
}

// ============ DATA LOGGER ============
const DB_KEY = 'taixiu_history';

const logger = {
    data: [],
    
    init() {
        try {
            this.data = JSON.parse(localStorage.getItem(DB_KEY)) || [];
            console.log(`✓ Logger initialized (${this.data.length} records)`);
        } catch (e) {
            console.error('Logger init error:', e);
            this.data = [];
        }
    },
    
    log(id, d1, d2, d3, result) {
        try {
            const sum = (parseInt(d1) || 0) + (parseInt(d2) || 0) + (parseInt(d3) || 0);
            const resultStr = String(result || '').toUpperCase();
            const isTai = sum > 10 || (sum === 0 && resultStr.includes('TÀI'));
            
            this.data.push({
                id: id,
                timestamp: Date.now(),
                dice1: parseInt(d1) || 0,
                dice2: parseInt(d2) || 0,
                dice3: parseInt(d3) || 0,
                sum: sum,
                actual: isTai ? 'TAI' : 'XIU',
                raw: result
            });
            
            localStorage.setItem(DB_KEY, JSON.stringify(this.data));
        } catch (e) {
            console.error('Log error:', e);
        }
    },
    
    export() {
        let csv = 'id,timestamp,dice1,dice2,dice3,sum,actual,raw\n';
        this.data.forEach(r => {
            csv += `${r.id},${r.timestamp},${r.dice1},${r.dice2},${r.dice3},${r.sum},${r.actual},"${r.raw}"\n`;
        });
        return csv;
    },
    
    clear() {
        this.data = [];
        localStorage.removeItem(DB_KEY);
    }
};

function setupDataLogger() {
    logger.init();
    console.log('✓ Data logger ready');
}

// ============ ANALYTICS ============
function setupAnalytics() {
    const analysisBtn = document.getElementById('analysisBtn');
    if (analysisBtn) {
        analysisBtn.addEventListener('click', openDashboard);
        console.log('✓ Analytics button ready');
    }
}

function openDashboard() {
    if (logger.data.length === 0) {
        alert('No data yet. Watch some rounds first.');
        return;
    }

    const stats = calculateStats();
    
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(0,0,0,0.95); backdrop-filter: blur(5px);
        overflow-y: auto; padding: 20px;
        color: #fff; font-family: monospace;
    `;
    
    let html = `
        <div style="max-width: 900px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #00ff88; padding-bottom: 10px;">
                <h2 style="color: #00ff88; margin: 0;">🔬 ANALYSIS DASHBOARD</h2>
                <button onclick="this.closest('[style*=fixed]').remove()" style="background: #ff4466; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; color: #fff; font-weight: bold;">CLOSE</button>
            </div>
            
            <div style="background: rgba(0,255,136,0.1); padding: 15px; border-left: 4px solid #00ff88; border-radius: 4px; margin-bottom: 20px;">
                <div style="font-size: 12px; color: #aaa;">TOTAL ROUNDS</div>
                <div style="color: #00ff88; font-size: 28px; font-weight: bold;">${stats.total}</div>
            </div>
            
            <div style="background: rgba(0,255,136,0.1); padding: 15px; border-left: 4px solid #00ff88; border-radius: 4px; margin-bottom: 20px;">
                <div style="font-size: 12px; color: #aaa;">TAI vs XIU</div>
                <div style="color: #00ff88; font-size: 18px; font-weight: bold;">
                    ${stats.tai} TAI (${stats.tai_pct.toFixed(2)}%) | ${stats.xiu} XIU (${stats.xiu_pct.toFixed(2)}%)
                </div>
            </div>
            
            <div style="background: #1a1a2e; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                <h3 style="color: #00ff88; margin-top: 0;">EXPORT DATA</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="
                        const csv = logger.export();
                        const blob = new Blob([csv], { type: 'text/csv' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'taixiu_' + Date.now() + '.csv';
                        a.click();
                    " style="background: #00ff88; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; color: #000; font-weight: bold;">📥 EXPORT CSV</button>
                    
                    <button onclick="exportSessionsJSON()" style="background: #ffd966; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; color: #000; font-weight: bold;">📥 EXPORT JSON (SESSIONS)</button>
                    
                    <button onclick="
                        const sessions = getSessions();
                        console.log('All Sessions:', sessions);
                        alert('Sessions logged to console (F12) - ' + sessions.length + ' sessions');
                    " style="background: #0088ff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; color: #fff; font-weight: bold;">🖥️ VIEW JSON</button>
                </div>
            </div>
        </div>
    `;
    
    modal.innerHTML = html;
    document.body.appendChild(modal);
}

function calculateStats() {
    const tai = logger.data.filter(r => r.actual === 'TAI').length;
    const total = logger.data.length;
    return {
        total: total,
        tai: tai,
        xiu: total - tai,
        tai_pct: (tai / total) * 100,
        xiu_pct: ((total - tai) / total) * 100
    };
}

// ============ FETCH LOOP ============
const API_URL = 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8';

let lastPhienId = null;
let predictions = []; // Track all predictions
const SESSION_LOG_KEY = 'taixiu_sessions_json';

function setupFetchLoop() {
    setInterval(fetchAndLog, 2000);
    console.log('✓ Fetch loop started');
}

async function fetchAndLog() {
    try {
        const c = new AbortController();
        const timeout = setTimeout(() => c.abort(), 4000);
        
        const r = await fetch(API_URL, { signal: c.signal, cache: 'no-store' });
        clearTimeout(timeout);
        
        if (!r.ok) return;
        
        const data = await r.json();
        if (!data || !data.list || data.list.length === 0) return;
        
        const latest = data.list[0];
        if (!latest) return;
        
        // Check if new phien
        if (latest.sessionId && latest.sessionId !== lastPhienId) {
            lastPhienId = latest.sessionId;
            
            // Log to storage
            if (latest.dice1 && latest.dice2 && latest.dice3) {
                const result = latest.result || '';
                logger.log(latest.sessionId, latest.dice1, latest.dice2, latest.dice3, result);
            }
            
            // Display prediction overlay (IMPORTANT!)
            displayPrediction(latest);
        }
    } catch (e) {
        // Silently fail
    }
}

function displayPrediction(data) {
    try {
        const phienId = data.sessionId || '#' + Math.floor(Math.random() * 10000000);
        const d1 = parseInt(data.dice1) || 0;
        const d2 = parseInt(data.dice2) || 0;
        const d3 = parseInt(data.dice3) || 0;
        const sum = d1 + d2 + d3;
        const result = String(data.result || '').toUpperCase();
        const isTai = sum > 10 || (sum === 0 && result.includes('TÀI'));
        const actualResult = isTai ? 'TÀI' : 'XIU';
        
        // Simple prediction: use win rate from logger data
        const stats = calculateStats();
        const winRate = stats.total > 0 ? stats.tai / stats.total : 0.5;
        let prediction = winRate > 0.5 ? 'TÀI' : 'XIU';
        let confidence = Math.abs(winRate - 0.5) * 200; // 50-100%
        confidence = Math.min(Math.max(confidence, 45), 99);
        
        // Track prediction
        const isCorrect = prediction === actualResult;
        predictions.push({
            phienId: phienId,
            predicted: prediction,
            actual: actualResult,
            correct: isCorrect,
            confidence: confidence,
            dices: [d1, d2, d3],
            sum: sum,
            timestamp: Date.now()
        });
        
        // Calculate rolling accuracy (last 20 predictions)
        const recent = predictions.slice(-20);
        const recentAccuracy = (recent.filter(p => p.correct).length / recent.length) * 100;
        
        // Create overlay
        const overlay = document.createElement('div');
        overlay.id = 'prediction-overlay';
        overlay.style.cssText = `
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(0,20,40,0.95));
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 25px 30px;
            z-index: 9998;
            min-width: 300px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,255,136,0.3), inset 0 0 30px rgba(0,255,136,0.1);
            animation: slideDown 0.4s ease-out;
            font-family: monospace;
            color: #fff;
        `;
        
        const borderColor = isCorrect ? '#00ff88' : '#ff6666';
        const resultBg = isCorrect ? 'rgba(0,255,136,0.1)' : 'rgba(255,100,100,0.1)';
        
        overlay.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #00ff88;">
                <h3 style="margin: 0; color: #00ff88; font-size: 14px;">ROBOT HỒ QUỐC</h3>
                <span style="font-size: 12px; color: #ffd966;">LIVE REC</span>
            </div>
            
            <div style="margin-bottom: 12px;">
                <div style="color: #aaa; font-size: 11px; margin-bottom: 3px;">PHIÊN:</div>
                <div style="color: #ffd966; font-size: 14px; font-weight: bold;">${phienId}</div>
            </div>
            
            <div style="margin-bottom: 15px; background: ${resultBg}; padding: 12px; border-radius: 6px; border: 1px solid ${borderColor};">
                <div style="color: #aaa; font-size: 10px; margin-bottom: 5px;">DỰ ĐOÁN vs KẾT QUẢ:</div>
                <div style="display: flex; justify-content: space-around; align-items: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: #00ddff;">${prediction}</div>
                        <div style="font-size: 9px; color: #aaa; margin-top: 2px;">Dự đoán</div>
                    </div>
                    <div style="font-size: 20px; color: ${isCorrect ? '#00ff88' : '#ff6666'};">${isCorrect ? '✓' : '✗'}</div>
                    <div style="text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: ${actualResult === 'TÀI' ? '#00ff88' : '#ff6666'};">${actualResult}</div>
                        <div style="font-size: 9px; color: #aaa; margin-top: 2px;">Thực tế</div>
                    </div>
                </div>
            </div>
            
            <div style="background: rgba(0,255,136,0.1); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px;">
                <div style="color: #aaa; font-size: 10px; margin-bottom: 5px;">CONFIDENCE:</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="flex: 1; height: 6px; background: rgba(0,255,136,0.2); border-radius: 3px;">
                        <div style="width: ${confidence}%; height: 100%; background: linear-gradient(90deg, #00ff88, #00ddff); border-radius: 3px;"></div>
                    </div>
                    <div style="color: #00ff88; font-weight: bold; font-size: 13px; min-width: 40px;">${confidence.toFixed(0)}%</div>
                </div>
            </div>
            
            <div style="background: rgba(255,215,0,0.1); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px;">
                <div style="color: #aaa; font-size: 10px; margin-bottom: 4px;">ACCURACY (20 phiên gần):</div>
                <div style="font-size: 16px; font-weight: bold; color: #ffd966;">${recentAccuracy.toFixed(1)}% (${recent.filter(p => p.correct).length}/${recent.length})</div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 11px; color: #aaa; padding-top: 10px; border-top: 1px solid rgba(0,255,136,0.2);">
                <div style="text-align: center;"><div style="color: #fff; font-weight: bold;">${d1}</div><div style="font-size: 9px; color: #666;">Xúc 1</div></div>
                <div style="text-align: center;"><div style="color: #fff; font-weight: bold;">${d2}</div><div style="font-size: 9px; color: #666;">Xúc 2</div></div>
                <div style="text-align: center;"><div style="color: #fff; font-weight: bold;">${d3}</div><div style="font-size: 9px; color: #666;">Xúc 3 | Sum: ${sum}</div></div>
            </div>
            
            <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(0,255,136,0.2); color: #aaa; font-size: 9px; text-align: center;">
                Total predictions: ${predictions.length}
            </div>
        `;
        
        // Remove old overlay
        const old = document.getElementById('prediction-overlay');
        if (old) old.remove();
        
        document.body.appendChild(overlay);
        console.log(`✓ Overlay displayed for phiên ${phienId}`);
        
        // Auto-hide after 12 seconds (was 10)
        setTimeout(() => {
            overlay.style.animation = 'slideUp 0.4s ease-in forwards';
            setTimeout(() => overlay.remove(), 400);
        }, 12000);
        
        // Log to console for debugging
        console.log(`Phiên ${phienId}: Dự đoán ${prediction} (${confidence.toFixed(0)}%), Thực tế ${actualResult} - ${isCorrect ? 'ĐÚNG' : 'SAI'}, Accuracy: ${recentAccuracy.toFixed(1)}%`);
        
        // Save to JSON log
        saveSessionJSON({
            phienId: phienId,
            timestamp: new Date().toISOString(),
            prediction: prediction,
            actual: actualResult,
            correct: isCorrect,
            confidence: confidence,
            dices: [d1, d2, d3],
            sum: sum,
            accuracy_20_recent: recentAccuracy,
            total_predictions: predictions.length
        });

        
    } catch (e) {
        console.error('Display prediction error:', e);
    }
}



/* ============ JSON SESSION LOGGER ============ */
function saveSessionJSON(sessionData) {
    try {
        let sessions = [];
        const SESSION_LOG_KEY = 'taixiu_sessions_json';
        const stored = localStorage.getItem(SESSION_LOG_KEY);
        if (stored) {
            sessions = JSON.parse(stored);
        }
        
        sessions.push(sessionData);
        localStorage.setItem(SESSION_LOG_KEY, JSON.stringify(sessions));
        console.log(`Session saved. Total: ${sessions.length}`);
        
        // Also try to save to file via fetch (GitHub Pages limitation - read-only)
        // For manual upload: export and put sessions.json in repo
        
    } catch (e) {
        console.error('JSON save error:', e);
    }
}

function exportSessionsJSON() {
    try {
        const SESSION_LOG_KEY = 'taixiu_sessions_json';
        const stored = localStorage.getItem(SESSION_LOG_KEY);
        if (!stored) {
            alert('No session data yet');
            return;
        }
        
        const sessions = JSON.parse(stored);
        const json = JSON.stringify(sessions, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'taixiu_sessions_' + Date.now() + '.json';
        a.click();
        
        console.log(`Exported ${sessions.length} sessions to JSON`);
    } catch (e) {
        console.error('Export error:', e);
    }
}

function getSessions() {
    try {
        const SESSION_LOG_KEY = 'taixiu_sessions_json';
        const stored = localStorage.getItem(SESSION_LOG_KEY);
        return stored ? JSON.parse(stored) : [];
    } catch (e) {
        return [];
    }
}

// Kelly Calculator
const kellyBtn = document.getElementById('kellyBtn');
if (kellyBtn) {
    kellyBtn.addEventListener('click', () => {
        if (logger.data.length < 30) {
            alert('Need at least 30 rounds for accurate Kelly calculation');
            return;
        }
        
        const stats = calculateStats();
        const winRate = stats.tai / stats.total;
        const kelly = Math.max((winRate * 1 - (1 - winRate)) / 1, 0);
        
        alert(`Kelly Criterion (TAI bet):\n\nWin Rate: ${(winRate * 100).toFixed(2)}%\nKelly f*: ${kelly.toFixed(4)}\n\n¼ Kelly: ${(kelly * 0.25 * 100).toFixed(2)}%\n½ Kelly: ${(kelly * 0.5 * 100).toFixed(2)}%`);
    });
}
</script>
