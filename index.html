<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Hồ Quốc - Tài Xỉu Analysis</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #000; 
    color: #fff; 
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
}

.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #00ff88, #ffd966, #00ff88);
    background-size: 200% auto;
    animation: flow 2s linear infinite;
    z-index: 9998;
}

@keyframes flow { 
    0% { background-position: 0% 50%; } 
    100% { background-position: 200% 50%; } 
}

#robot {
    position: fixed;
    top: 50%; left: 10px;
    z-index: 9999;
    display: flex;
    align-items: center;
    cursor: grab;
    user-select: none;
}

#robot:active { cursor: grabbing; }

#robot img, .robot-emoji-fallback {
    width: 90px;
    height: 90px;
    pointer-events: none;
    filter: drop-shadow(0 0 15px #00ff88);
    animation: hoverRobot 3s ease-in-out infinite;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.robot-emoji-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}

@keyframes hoverRobot {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.1); }
}

#robot-info {
    background: rgba(0, 20, 40, 0.9);
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 15px 20px;
    margin-left: 15px;
    min-width: 200px;
    max-width: calc(100vw - 120px);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    animation: boxPulse 2s ease-in-out infinite;
}

@keyframes boxPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.05); }
    50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.4), inset 0 0 20px rgba(0, 255, 136, 0.1); }
}

#robot-info h3 {
    color: #00ff88;
    font-size: 16px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
}

#robot-info p {
    color: #aaa;
    font-size: 12px;
    margin: 0;
}

.status-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.control-buttons {
    position: absolute;
    top: -45px;
    right: 0;
    display: flex;
    gap: 8px;
}

.control-btn {
    background: #1a1a2e;
    border: 2px solid #ffd966;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    color: #ffd966;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-weight: bold;
}

.control-btn:hover {
    background: #ffd966;
    color: #000;
    transform: scale(1.1);
}

.control-btn.analysis-btn { border-color: #00ff88; color: #00ff88; }
.control-btn.analysis-btn:hover { background: #00ff88; color: #000; }
</style>
</head>
<body>

<div class="top-bar"></div>

<iframe src="https://lc79b.bet" style="position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1;"></iframe>

<div id="robot">
    <img src="https://i.postimg.cc/rwkZQhxp/Robot.gif" alt="Robot" 
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    <span class="robot-emoji-fallback" style="display:none">🤖</span>
    
    <div id="robot-info">
        <h3><span class="status-indicator"></span> ROBOT HỒ QUỐC</h3>
        <p>Đang đồng bộ thuật toán da tằng...</p>
    </div>
    
    <div class="control-buttons">
        <button class="control-btn analysis-btn" id="analysisBtn" title="Analytics Dashboard">📊</button>
        <button class="control-btn" id="kellyBtn" title="Kelly Criterion">💰</button>
    </div>
</div>

<script>
'use strict';

// Global error handler
window.addEventListener('error', (e) => {
    console.error('UNCAUGHT ERROR:', e.message, 'at line', e.lineno);
});

window.addEventListener('unhandledrejection', (e) => {
    console.error('UNHANDLED REJECTION:', e.reason);
});

// Wait for DOM ready
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM Ready - initializing...');
    initializeApp();
});

function initializeApp() {
    try {
        setupDrag();
        setupDataLogger();
        setupAnalytics();
        setupFetchLoop();
        console.log('✓ App initialized');
    } catch (e) {
        console.error('Init error:', e.message);
    }
}

// ============ DRAG FUNCTIONALITY ============
function setupDrag() {
    const robot = document.getElementById('robot');
    if (!robot) {
        console.error('Robot element not found');
        return;
    }

    let drag = false, sx = 0, sy = 0;

    // Center robot initially
    setTimeout(() => {
        try {
            const h = robot.offsetHeight;
            robot.style.top = (window.innerHeight / 2 - h / 2) + 'px';
        } catch (e) {
            console.error('Positioning error:', e);
        }
    }, 100);

    robot.addEventListener('mousedown', (e) => {
        drag = true;
        const r = robot.getBoundingClientRect();
        sx = e.clientX - r.left;
        sy = e.clientY - r.top;
        e.preventDefault();
    });

    robot.addEventListener('touchstart', (e) => {
        drag = true;
        const t = e.touches[0];
        const r = robot.getBoundingClientRect();
        sx = t.clientX - r.left;
        sy = t.clientY - r.top;
    }, { passive: true });

    document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        robot.style.left = (e.clientX - sx) + 'px';
        robot.style.top = (e.clientY - sy) + 'px';
    });

    document.addEventListener('touchmove', (e) => {
        if (!drag) return;
        const t = e.touches[0];
        robot.style.left = (t.clientX - sx) + 'px';
        robot.style.top = (t.clientY - sy) + 'px';
    }, { passive: false });

    document.addEventListener('mouseup', () => { drag = false; });
    document.addEventListener('touchend', () => { drag = false; });
    
    console.log('✓ Drag setup complete');
}

// ============ DATA LOGGER ============
const DB_KEY = 'taixiu_history';

const logger = {
    data: [],
    
    init() {
        try {
            this.data = JSON.parse(localStorage.getItem(DB_KEY)) || [];
            console.log(`✓ Logger initialized (${this.data.length} records)`);
        } catch (e) {
            console.error('Logger init error:', e);
            this.data = [];
        }
    },
    
    log(id, d1, d2, d3, result) {
        try {
            const sum = (parseInt(d1) || 0) + (parseInt(d2) || 0) + (parseInt(d3) || 0);
            const resultStr = String(result || '').toUpperCase();
            const isTai = sum > 10 || (sum === 0 && resultStr.includes('TÀI'));
            
            this.data.push({
                id: id,
                timestamp: Date.now(),
                dice1: parseInt(d1) || 0,
                dice2: parseInt(d2) || 0,
                dice3: parseInt(d3) || 0,
                sum: sum,
                actual: isTai ? 'TAI' : 'XIU',
                raw: result
            });
            
            localStorage.setItem(DB_KEY, JSON.stringify(this.data));
        } catch (e) {
            console.error('Log error:', e);
        }
    },
    
    export() {
        let csv = 'id,timestamp,dice1,dice2,dice3,sum,actual,raw\n';
        this.data.forEach(r => {
            csv += `${r.id},${r.timestamp},${r.dice1},${r.dice2},${r.dice3},${r.sum},${r.actual},"${r.raw}"\n`;
        });
        return csv;
    },
    
    clear() {
        this.data = [];
        localStorage.removeItem(DB_KEY);
    }
};

function setupDataLogger() {
    logger.init();
    console.log('✓ Data logger ready');
}

// ============ ANALYTICS ============
function setupAnalytics() {
    const analysisBtn = document.getElementById('analysisBtn');
    if (analysisBtn) {
        analysisBtn.addEventListener('click', openDashboard);
        console.log('✓ Analytics button ready');
    }
}

function openDashboard() {
    if (logger.data.length === 0) {
        alert('No data yet. Watch some rounds first.');
        return;
    }

    const stats = calculateStats();
    
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(0,0,0,0.95); backdrop-filter: blur(5px);
        overflow-y: auto; padding: 20px;
        color: #fff; font-family: monospace;
    `;
    
    let html = `
        <div style="max-width: 900px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #00ff88; padding-bottom: 10px;">
                <h2 style="color: #00ff88; margin: 0;">🔬 ANALYSIS DASHBOARD</h2>
                <button onclick="this.closest('[style*=fixed]').remove()" style="background: #ff4466; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; color: #fff; font-weight: bold;">CLOSE</button>
            </div>
            
            <div style="background: rgba(0,255,136,0.1); padding: 15px; border-left: 4px solid #00ff88; border-radius: 4px; margin-bottom: 20px;">
                <div style="font-size: 12px; color: #aaa;">TOTAL ROUNDS</div>
                <div style="color: #00ff88; font-size: 28px; font-weight: bold;">${stats.total}</div>
            </div>
            
            <div style="background: rgba(0,255,136,0.1); padding: 15px; border-left: 4px solid #00ff88; border-radius: 4px; margin-bottom: 20px;">
                <div style="font-size: 12px; color: #aaa;">TAI vs XIU</div>
                <div style="color: #00ff88; font-size: 18px; font-weight: bold;">
                    ${stats.tai} TAI (${stats.tai_pct.toFixed(2)}%) | ${stats.xiu} XIU (${stats.xiu_pct.toFixed(2)}%)
                </div>
            </div>
            
            <div style="background: #1a1a2e; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                <h3 style="color: #00ff88; margin-top: 0;">EXPORT</h3>
                <button onclick="
                    const csv = logger.export();
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'taixiu_' + Date.now() + '.csv';
                    a.click();
                " style="background: #00ff88; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; color: #000; font-weight: bold;">📥 EXPORT CSV</button>
            </div>
        </div>
    `;
    
    modal.innerHTML = html;
    document.body.appendChild(modal);
}

function calculateStats() {
    const tai = logger.data.filter(r => r.actual === 'TAI').length;
    const total = logger.data.length;
    return {
        total: total,
        tai: tai,
        xiu: total - tai,
        tai_pct: (tai / total) * 100,
        xiu_pct: ((total - tai) / total) * 100
    };
}

// ============ FETCH LOOP ============
const API_URL = 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8';

function setupFetchLoop() {
    setInterval(fetchAndLog, 3000);
    console.log('✓ Fetch loop started');
}

async function fetchAndLog() {
    try {
        const c = new AbortController();
        const timeout = setTimeout(() => c.abort(), 4000);
        
        const r = await fetch(API_URL, { signal: c.signal, cache: 'no-store' });
        clearTimeout(timeout);
        
        if (!r.ok) return;
        
        const data = await r.json();
        if (!data || !data.list || data.list.length === 0) return;
        
        const latest = data.list[0];
        if (latest && latest.dice1 && latest.dice2 && latest.dice3) {
            const result = latest.result || '';
            logger.log(latest.sessionId || Date.now(), latest.dice1, latest.dice2, latest.dice3, result);
        }
    } catch (e) {
        // Silently fail (normal for CORS or timeout)
    }
}

// Kelly Calculator
const kellyBtn = document.getElementById('kellyBtn');
if (kellyBtn) {
    kellyBtn.addEventListener('click', () => {
        if (logger.data.length < 30) {
            alert('Need at least 30 rounds for accurate Kelly calculation');
            return;
        }
        
        const stats = calculateStats();
        const winRate = stats.tai / stats.total;
        const kelly = Math.max((winRate * 1 - (1 - winRate)) / 1, 0);
        
        alert(`Kelly Criterion (TAI bet):\n\nWin Rate: ${(winRate * 100).toFixed(2)}%\nKelly f*: ${kelly.toFixed(4)}\n\n¼ Kelly: ${(kelly * 0.25 * 100).toFixed(2)}%\n½ Kelly: ${(kelly * 0.5 * 100).toFixed(2)}%`);
    });
}

console.log('Scripts loaded and ready to go.');
</script>

</body>
</html>
